{% extends "base.html" %}
{% block title %}Game review · Chessdotcom AI Coach{% endblock %}

{% block content %}
<div class="page">
  <div class="home__head">
    <div>
      <h1 class="home__title">Game review</h1>
      {% include "partials/home_count.html" %}
    </div>
    <div class="home__filters">
      <button type="button" class="btn btn--ghost btn--sm"
              hx-get="{% url 'game_list' %}?time_class={{ time_class }}"
              hx-target="#game-list"
              hx-swap="innerHTML">
        <i class="fa-solid fa-arrows-rotate"></i>Refresh
      </button>
    </div>
  </div>

  <div id="game-list">
    {% include "partials/game_list.html" %}
  </div>
</div>
{% endblock %}
