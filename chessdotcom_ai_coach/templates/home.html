{% extends "base.html" %}
{% block title %}Live games · Chessdotcom AI Coach{% endblock %}

{% block content %}
<div class="page">
  <div class="home__head">
    <div>
      <h1 class="home__title">Live games</h1>
      {% include "partials/home_count.html" %}
    </div>
    <div class="home__filters">
      <span class="filter-chip">Sort: Most recent &#9662;</span>
      <span class="filter-chip">All time controls &#9662;</span>
      <button type="button" class="btn btn--ghost btn--sm"
              hx-get="{% url 'game_list' %}"
              hx-target="#game-list"
              hx-swap="innerHTML">
        <i class="fa-solid fa-arrows-rotate"></i>Refresh
      </button>
    </div>
  </div>

  <div id="game-list">
    {% include "partials/game_list.html" %}
  </div>
</div>
{% endblock %}
