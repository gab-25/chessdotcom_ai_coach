services:

  web:
    build: .
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=llama3.2:3b
      - REDIS_URL=redis://redis:6379/0
      - STOCKFISH_PATH=stockfish
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=llama3.2:3b
      - REDIS_URL=redis://redis:6379/0
      - STOCKFISH_PATH=stockfish
    command: celery -A chessdotcom_ai_coach worker -l info
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    # Ollama serves the coach prose behind an OpenAI-compatible endpoint on /v1.
    # OLLAMA_KEEP_ALIVE unloads the model 30s after the last request: on an 8GB
    # node the ~2GB of weights must not stay resident between analyses.
    # OLLAMA_MODEL is read by the entrypoint's pull only; the model actually sent
    # with each request is LLM_MODEL on web/worker. Keep the two in sync.
    environment:
      - OLLAMA_KEEP_ALIVE=30s
      - OLLAMA_MODEL=llama3.2:3b
    entrypoint: ["/bin/sh", "/ollama-entrypoint.sh"]
    # Drop the image's default CMD ("serve"); the entrypoint starts the server.
    command: []
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh:ro

volumes:
  postgres-data:
  ollama-data:
