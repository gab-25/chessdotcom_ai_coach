services:

  web:
    build: .
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - LLM_BASE_URL=http://llm:8080/v1
      - REDIS_URL=redis://redis:6379/0
      - STOCKFISH_PATH=stockfish
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - LLM_BASE_URL=http://llm:8080/v1
      - REDIS_URL=redis://redis:6379/0
      - STOCKFISH_PATH=stockfish
    command: celery -A chessdotcom_ai_coach worker -l info
    depends_on:
      postgres:
        condition: service_healthy
      llm:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    # llama-server: OpenAI-compatible endpoint for the coach prose.
    # -hf auto-downloads the GGUF into the cache volume on first start;
    # -c bounds the KV cache (RAM), --jinja uses the model's embedded chat template.
    command: >
      -hf bartowski/Llama-3.2-3B-Instruct-GGUF:Q4_K_M
      --host 0.0.0.0 --port 8080 -c 4096 --jinja
    ports:
      - "8080:8080"
    volumes:
      - llm-models:/root/.cache/llama.cpp

volumes:
  postgres-data:
  llm-models:
